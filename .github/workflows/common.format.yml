name: common-format

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup

      # Prettier owns the whole repository, including docs and workflows, so it
      # runs once here rather than per package.
      - name: Linting Prettier
        run: pnpm lint:prettier
