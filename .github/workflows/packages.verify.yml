name: packages-verify

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/actions/setup/**"
      - ".github/workflows/packages.verify.yml"
      - "scripts/verify-packages.mjs"
      - "packages/**"
  push:
    branches:
      - "main"
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/actions/setup/**"
      - ".github/workflows/packages.verify.yml"
      - "scripts/verify-packages.mjs"
      - "packages/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Build packages
        run: pnpm build

      # Packs both packages, lints them with publint, then installs them into a
      # throwaway consumer to check exports, generated types, SSR, browser
      # bundling, CLI drift detection, and watcher shutdown.
      - name: Packaged consumer
        run: pnpm test:package

      - name: Upload verified codegen package
        uses: actions/upload-artifact@v4
        with:
          name: codegen-release
          path: .artifacts/codegen-release/
          if-no-files-found: error
          retention-days: 14

      - name: Upload verified devtools package
        uses: actions/upload-artifact@v4
        with:
          name: devtools-release
          path: .artifacts/devtools-release/
          if-no-files-found: error
          retention-days: 14
