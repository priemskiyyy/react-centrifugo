name: packages-verify

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/actions/setup/**"
      - ".github/workflows/packages.verify.yml"
      - "scripts/verify-packages.mjs"
      - "packages/**"
  push:
    branches:
      - "main"
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/actions/setup/**"
      - ".github/workflows/packages.verify.yml"
      - "scripts/verify-packages.mjs"
      - "packages/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Build packages
        run: pnpm build

      # Packs the package, lints it with publint, then installs it into a
      # throwaway consumer to check exports, generated types, SSR, browser
      # bundling, and the shared CLI against the published hooks.
      - name: Packaged consumer
        run: pnpm test:package
