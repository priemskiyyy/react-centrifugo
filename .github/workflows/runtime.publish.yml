name: runtime-publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  metadata:
    if: startsWith(github.event.release.tag_name, 'react-centrifugo-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/verify-release.mjs
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
  library:
    needs: metadata
    uses: ./.github/workflows/library.test.yml
  browsers:
    needs: metadata
    uses: ./.github/workflows/browser.test.yml
  docs:
    needs: metadata
    uses: ./.github/workflows/docs.test.yml
  format:
    needs: metadata
    uses: ./.github/workflows/common.format.yml
  package:
    needs: metadata
    uses: ./.github/workflows/runtime.verify.yml
  publish:
    needs: [library, browsers, docs, format, package]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: runtime-release
          path: release
      - name: Publish the verified package
        working-directory: release
        env:
          NPM_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: |
          sha256sum --check SHA256SUMS
          npm publish react-centrifugo-*.tgz --access public --provenance --tag "$NPM_TAG"
