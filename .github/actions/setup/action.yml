name: Setup workspace

description: |
  Install pnpm and Node, then install workspace dependencies from the lockfile.

inputs:
  node-version:
    description: Node version used by the job.
    default: "24"

runs:
  using: "composite"

  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
