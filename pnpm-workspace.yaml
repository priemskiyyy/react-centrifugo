packages:
  - packages/*
  - examples/*

allowBuilds:
  "@parcel/watcher": false
  esbuild: true
  msgpackr-extract: false
  protobufjs: false

# Published today; the workspace's minimum release age would reject them.
minimumReleaseAgeExclude:
  - "@priemskiyyy/simulcast@0.4.0"
  - "@priemskiyyy/simulcast-centrifugo@0.4.0"
  - "@priemskiyyy/simulcast-codegen@0.4.0"
  - "@priemskiyyy/simulcast-devtools@0.4.0"
  - "@priemskiyyy/simulcast-react@0.4.0"
